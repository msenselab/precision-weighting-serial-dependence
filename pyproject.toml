[project]
name = "sdu"
version = "1.1.0"
description = "Serial dependence and motion coherence in duration reproduction: behavioural analyses and the three-state Kalman observer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # pinned to the versions that produced the stored results; the mixed models are sensitive to them
    "numpy==2.4.4",
    "pandas==3.0.2",
    "scipy==1.17.1",
    "statsmodels==0.14.6",
    "matplotlib==3.10.9",
    "pyarrow>=14",
    "threadpoolctl>=3.0",
    "ipykernel>=6.25.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.10.4",
    "jupyter>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
